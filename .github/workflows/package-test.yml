name: Package Test Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version '^2.0.0'

      - name: Build macOS DMG
        run: cargo tauri build --bundles dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: 900Invoice-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version '^2.0.0'

      - name: Build Windows installer
        run: cargo tauri build --bundles nsis

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: 900Invoice-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
